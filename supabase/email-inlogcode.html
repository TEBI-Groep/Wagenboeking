<!-- Supabase > Authentication > Emails: body voor de templates "Magic Link" en "Confirm signup".
     Onderwerp: Je inlogcode voor de Wagenboeking
     {{ .Token }} = de code, {{ .SiteURL }} = Site URL uit Authentication > URL Configuration. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#ffffff;border:1px solid #e1e5e9;border-top:3px solid #13803f;border-radius:8px;">
        <tr>
          <td style="padding:28px 32px 0;">
            <img src="{{ .SiteURL }}/logo.png" width="112" alt="TEBI Bestratingsmaterialen" style="display:block;width:112px;height:auto;border:0;">
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;font-family:Arial,Helvetica,sans-serif;">
            <h1 style="margin:0 0 6px;font-size:20px;line-height:1.3;font-weight:600;color:#1d2730;">Je inlogcode</h1>
            <p style="margin:0;font-size:15px;line-height:1.5;color:#4c5d6c;">Vul deze code in op het inlogscherm van de Wagenboeking.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0;">
            <div style="display:inline-block;padding:12px 20px;border:1px solid #e1e5e9;border-radius:6px;background:#f7f8f9;font-family:Consolas,'Courier New',monospace;font-size:28px;font-weight:700;letter-spacing:6px;color:#1d2730;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 28px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#7c8893;">
            De code is 1 uur geldig. Heb je niet geprobeerd in te loggen? Dan kun je deze mail negeren.
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px;background:#f7f8f9;border-top:1px solid #e1e5e9;border-radius:0 0 8px 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#7c8893;">
            TEBI Bestratingsmaterialen · Wagenboeking<br>
            Deze mail is automatisch verstuurd.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
